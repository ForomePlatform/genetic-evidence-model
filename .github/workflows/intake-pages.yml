# Deploys the intake screening page (scripts/intake_screen/) together with
# the current synchronised draw log (study/draw_log.csv) to GitHub Pages.
# Every push that changes the log therefore refreshes the page's state.
# Enable in the repository settings: Pages -> Source -> GitHub Actions.
name: Deploy intake screen

on:
  push:
    # dev-v.3x is temporary, until the study tooling merges into master
    branches: [master, dev-v.3x]
    paths:
      - "scripts/intake_screen/**"
      - "study/draw_log.csv"
      - ".github/workflows/intake-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs because the artifacts API can lag a
# fresh upload (deploy-pages saw "Found 0 artifact(s)" one second after a
# successful upload, 2026-11-22): the job boundary gives the artifact time
# to appear, and re-running only the failed deploy job cannot upload a
# duplicate artifact, which a re-run of a combined job does.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp scripts/intake_screen/index.html _site/
          cp scripts/intake_screen/draw_data.json _site/
          cp study/draw_log.csv _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Let the uploaded artifact become visible
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
