      Box, CpG Island, Poly-A Addition Site. Close, not exact: the concept is gene-anchored (''elements that
      comprise a gene or transcription unit''), so gene-free intergenic elements sit awkwardly, while membership
      is structural (introns, switch regions) — narrower in anchoring, broader in membership. Rejected narrower
      readings: C0314642 Regulatory Element, Coding Region (children); C2333586 ''DNA molecule region'' (FMA
      parthood incl. Linker DNA, fails D).'
