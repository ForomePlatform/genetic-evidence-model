  "target_type/INTERVAL":
    accept: C1707511
    note: 'Token INTERVAL = ''a coordinate interval (bp or cM)'' (schema) — the coordinate system is the semantic
      core, so the composite is (Coordinate, Coordinate) x genomic axis and C1707511 ''Coordinate'' (NCI C44465,
