# Curator adjudications for the UMLS crosswalk review/unmapped entries.
# Applied by build_umls_crosswalk.py AFTER querying. 'accept' is used only if the
# CUI was among the query's candidates OR the harness can fetch it live from UMLS;
# the harness never fabricates a concept the curator merely named. 'unmapped: true'
# records a considered 'no faithful UMLS concept' (honest finding). Edited via
# mapping/adjudicate_ui.py.
adjudications:
  "credibility/(axis)": {accept_sty: T080, note: "Qualitative Concept: the scope the pre-registered sweep searched; all four tiers argued unmapped (see S1 credibility note)."}
  "credibility/HIGH":
    unmapped: true
    note: 'GEM-internal defeasibility tier (the curator''s belief-revision policy, see S1 note). The pre-registered
      sweep found no UMLS concept denoting a degree of epistemic warrant usable as a point of this scale:
      qualifier values are measurand degrees (A); NCI Level of Evidence is a study-design hierarchy (A/C);
      the NCI Confidence answer set and LOINC/PROMIS confidence items are questionnaire responses (D); SNOMED
      definite/probable/possible are diagnostic-certainty modality (C).'
    relation: none
    rejected:
    - cui: C0205250
      fails: A
      name: High
      sab: MTH
      why: 'SNOMED 75540009 |High (qualifier value)| IS-A Increased: magnitude of a measurand, not epistemic
        degree (concept is live in UMLS 2026AA)'
    - cui: C1522410
      fails: A
      name: Highest
      sab: MTH
      why: qualifier value, measurand degree
    - cui: C4330261
      fails: D
      name: High Confidence
      sab: NCI
      why: questionnaire response option (assessment answer), not an evidence grade
    - cui: C2986612
      fails: A
      name: Level of Evidence I
      sab: NCI
      why: 'NCI/PDQ level of evidence: a study-design hierarchy, not a degree of warrant; would collapse GEM
        method into credibility (also C)'
    - cui: C0393009
      fails: A
      name: Level of Evidence
      sab: MTH
      why: the dimension (study-design hierarchy), not a level; also B
    - cui: C0439544
      fails: C
      name: Definite
      sab: MTH
      why: 'SNOMED diagnostic-certainty modality (definite/probable/possible): likelihood a proposition holds,
        three points, no intensified top; bound to diagnosis assertions (also D)'
    - cui: C0332148
      fails: C
      name: Probable diagnosis
      sab: MTH
      why: diagnostic-certainty modality, see Definite
    - cui: C0332149
      fails: C
      name: Possible
      sab: MTH
      why: diagnostic-certainty modality, see Definite
    - cui: C4760312
      fails: D
      name: Level of evidence (molecular pathology, LOINC)
      sab: MTH
      why: AMP/ASCO/CAP clinical-actionability tier for a variant report, not curator warrant (also B)
    - cui: C5556778
      fails: D
      name: Metabolite Identification Confidence Level
      sab: NCI
      why: 'Schymanski identification-confidence ladder: confidence in a structure identification, domain-bound'
    - cui: C0456878
      fails: D
      name: Degree of certainty of TNM classification
      sab: SNOMEDCT_US
      why: 'TNM C-factor: certainty of one patient''s staging, a diagnostic-assertion qualifier'
    protocol:
      queries:
      - very high
      - extremely high
      - highest
      - maximal
      - high
      - moderate
      - medium
      - low
      - very low
      - minimal
      - markedly increased
      - strong
      - weak
      - definite
      - probable
      - possible
      - very high confidence
      - high confidence
      - moderate confidence
      - low confidence
      - high certainty
      - low certainty
      - level of evidence
      - quality of evidence
      - certainty of evidence
      - strength of evidence
      - strength of recommendation
      - confidence level
      - level of confidence
      - GRADE
      - grade of evidence
      - evidence grade
      - evidence strength
      - evidence level
      - evidence quality
      - quality of evidence high
      - quality of evidence moderate
      - quality of evidence low
      - certainty rating
      - degree of certainty
      - epistemic certainty
      - credibility
      scopes:
      - all
      match:
      - exact
      - normalizedString
      - words
      sabs:
      - MSH
      - NCI
      - SNOMEDCT_US
      - LNC
      - MEDLINEPLUS
      - HPO
      umls: '2026AA local index (protocol credibility v2: 174 queries, 497 candidates, all classified) + UTS
        current 2026-08-30 (505 candidates); see data/umls/sweeps/'
