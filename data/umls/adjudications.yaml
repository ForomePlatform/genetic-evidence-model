      the span. Nothing closer exists: ''Interval'' is Temporal Concept C1272706 or HL7 datatype C1552654;
      no genomic interval/region concept; C1517520 ''Genomic Segment'' is a BAC/YAC library-clone false friend
      (isa UML Entity). STY T082 Spatial Concept outside the T028 axis; accepted deliberately. Division of
      labor: SEGMENT = material stretch (Genetic Loci), INTERVAL = coordinate-specified span. SO region (SO:0000001)
      stays the external anchor (s15).'
    relation: related
