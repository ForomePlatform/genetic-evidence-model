  curator_note: 'Token INTERVAL = ''a coordinate interval (bp or cM)'' (schema) — the coordinate system
    is the semantic core, so the composite is (Coordinate, Coordinate) x genomic axis and C1707511 ''Coordinate''
    (NCI C44465, ''a number or other designation that identifies a position relative to an axis or grid'')
    anchors it as related, parallel to RELATED_GENE. Caveats: the concept is any-grid (children include
    GPS coordinates as well as End Coordinate / From-To Position Dimension fields) and denotes the point
    designation, not the span. Nothing closer exists: ''Interval'' is Temporal Concept C1272706 or HL7
    datatype C1552654; no genomic interval/region concept; C1517520 ''Genomic Segment'' is a BAC/YAC library-clone
    false friend (isa UML Entity). STY T082 Spatial Concept outside the T028 axis; accepted deliberately.
    Division of labor: SEGMENT = material stretch (Genetic Loci), INTERVAL = coordinate-specified span.
    SO region (SO:0000001) stays the external anchor (s15).'
