[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-mapping-studio"
version = "0.2.3"
description = "Forome Genetic Evidence Model: a reference data model, UMLS/OMOP crosswalk tooling, and SHACL validation for basic-science genetic evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE-code.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Michael Bouzinier", email = "michael.bouzinier@forome.org" },
]
keywords = [
    "genetic evidence", "semantic model", "UMLS", "crosswalk", "SHACL",
    "biomedical informatics", "variant interpretation", "curation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "rdflib>=7.0",
    "pyshacl>=0.27",
    "requests>=2.28",
    "PyMuPDF>=1.23",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://w3id.org/genetic-evidence-model/"
Repository = "https://github.com/ForomePlatform/genetic-evidence-model"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Local UMLS index on PostgreSQL (forome.gem.umls.local_umls).
local = ["psycopg[binary]>=3.1"]

[project.scripts]
gem-validate = "forome.gem.validation.validate_annotations:main"
gem-coverage = "forome.gem.validation.compute_coverage:main"
gem-umls-crosswalk = "forome.gem.umls.build_umls_crosswalk:main"
gem-umls-render = "forome.gem.umls.render_crosswalk_tex:main"
gem-umls-adjudicate = "forome.gem.umls.adjudicate_ui:main"
gem-mapping-studio = "forome.gem.umls.adjudicate_ui:main"
gem-umls-semantic-network = "forome.gem.umls.fetch_semantic_network:main"
gem-umls-load-local = "forome.gem.umls.local_umls:main"
gem-umls-sweep = "forome.gem.umls.sweep:main"
gem-umls-classify-credibility = "forome.gem.umls.classify_credibility_sweep:main"

# src-layout: package roots live under src/python/main; tests under src/python/test.
# `forome` and `forome.gem` are PEP 420 implicit namespace packages, so Forome
# can publish sibling `forome-*` distributions sharing the `forome.` namespace.
[tool.setuptools]
package-dir = { "" = "src/python/main" }

[tool.setuptools.packages.find]
where = ["src/python/main"]
namespaces = true

# Reference data (semantic_types.yaml, the SHACL schema, dimensions.md) lives
# at the repo root as the source of truth, shared by the paper, CI, and skill
# bundles; walk-up discovery finds it in-repo. For standalone installs the
# same files ship as SYNCED COPIES in forome.gem._reference (re-synced by
# scripts/release-pypi.sh; asserted in the test suite), used as a fallback
# when no repo is found.
[tool.setuptools.package-data]
"forome.gem._reference" = ["*.yaml", "*.ttl", "*.md"]
